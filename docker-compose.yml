version: '3.8'

services:
  router_api:
    build: .
    container_name: neobank_router_api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    # Ensures the model is trained and quantized to INT8 ONNX before Uvicorn starts
    command: >
      bash -c "python src/train_and_export.py && 
               uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload"

  router_ui:
    build: .
    container_name: neobank_router_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://router_api:8000
    volumes:
      - ./frontend:/app/frontend
      - ./src:/app/src
    command: streamlit run frontend/app.py --server.address 0.0.0.0
    depends_on:
      - router_api
